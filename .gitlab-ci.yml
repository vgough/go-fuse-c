image: golang:1.15

variables:
  GOFLAGS: -mod=readonly

cache:
  paths:
    - vendor

before_script:
  - apt-get update
  - apt-get install -y
    fuse
    libfuse-dev
  - apt-get clean

stages:
  - dependencies
  - test

.modcache: &modcache
  key: modcache
  paths:
    - vendor/

dependencies:
  stage: dependencies
  script: go mod download
  cache: *modcache

test:
  stage: test
  script: make race
  cache:
    <<: *modcache
    policy: pull

rust-test:
  image: rust:1.85
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y clang pkg-config libfuse3-dev
    - apt-get clean
  script:
    - cd rust
    - cargo check --all-targets
    - cargo test --no-run --all-targets
